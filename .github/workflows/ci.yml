name: CI
on:
  pull_request:
  push:
    branches:
      - develop
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 17
          os: ubuntu-latest
        - java: 21
          os: ubuntu-latest
        - java: 25
          os: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: gh extension install github/gh-actions-lock
    - run: gh actions-lock --verify
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
    - uses: coursier/cache-action@v9.0.1
    - uses: sbt/setup-sbt@v1.5.15
    - run: sbt --server "+ test" "+ scripted"
    - if: matrix.os != 'windows-latest'
      run: sbt --server scalafmtSbtCheck '+ scalafmtCheckAll'
    - run: rm -rf "${HOME}/.ivy2/local"
