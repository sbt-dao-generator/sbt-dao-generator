name: CI
on:
  pull_request:
  push:
    branches:
      - develop
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 17
          os: ubuntu-latest
        - java: 21
          os: ubuntu-latest
        - java: 25
          os: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
    - uses: coursier/cache-action@v8
    - uses: sbt/setup-sbt@v1
    - run: sbt --server "+ test" "+ scripted"
    - if: matrix.os != 'windows-latest'
      run: sbt --server scalafmtSbtCheck '+ scalafmtCheckAll'
    - run: rm -rf "${HOME}/.ivy2/local"
